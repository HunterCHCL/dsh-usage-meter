# dsh-usage-meter bundle patch
#
# 这是 `dsh.bundle.patch` 声明的 patch 层：当本插件被加入 profile 的
# `dsh.profile.bundles` 后，profile 启动时会合并本 patch —— 向插件
# 入口列表插入一行，把本插件挂载为 Cordis 宿主插件。
# 客户端半边通过 package.json 的 `dsh.client` 静态加载，无需逐会话审批。
#
# 注意：name 必须用 npm 包名 `@hunterchcl/dsh-usage-meter`（loader 以 profile
# 根目录为基准，经 node_modules 解析到本包 main=host.js）。不要写成 './host.js'
# —— 那会被解析成 profile 根目录下的 host.js，导致 ERR_MODULE_NOT_FOUND。
- insert:
    - id: dsh-usage-meter
      name: '@hunterchcl/dsh-usage-meter'
